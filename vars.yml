---
# ==============================================================================
# SNO Auto Builder Variables
# Customize the values in this file before running the playbooks.
# Sections marked [CHANGE] contain values that typically need to be updated.
# ==============================================================================

# Environment Prefix — used as a name prefix for all libvirt resources
sno_prefix: "sno01"

# Host Paths — all generated files are placed under sno_base_dir
# [CHANGE] sno_base_dir — base directory for all generated files (pool, OpenTofu state, ISO, scripts)
sno_base_dir: "{{ lookup('env', 'HOME') }}/sno-lab"
sno_pool_dir: "{{ sno_base_dir }}/pool"
sno_tf_dir: "{{ sno_base_dir }}/work"

# [CHANGE] OpenShift Version — pin to a specific release, e.g. "stable-4.22"
# Pull secret — download from https://console.redhat.com/openshift/install/pull-secret
sno_cluster_version: "stable"
sno_pull_secret_path: "{{ lookup('env', 'HOME') }}/openshift-pull-secret/openshift-pull-secret.txt"

# Management network (default_network) — host ↔ bastion, DHCP-assigned
# The bastion's management IP is NOT fixed here: it comes from the libvirt DHCP
# lease and is read back from the `bastion_ip` OpenTofu output at runtime.
sno_mgmt_network: "192.168.222.0/24"
sno_mgmt_bridge: "defbr0"

# Bastion VM Configuration
# [CHANGE] sno_bastion_password — default is "redhat"; set via cloud-init in bastion.tf.j2
#          Store it with ansible-vault rather than in plaintext for anything but a throwaway lab:
#            ansible-vault encrypt_string 'yourpassword' --name sno_bastion_password
# [CHANGE] sno_bastion_os_image — CentOS Stream 9 generic cloud image (cloud-init compatible qcow2)
sno_bastion_user: "redhat"
sno_bastion_password: "redhat"
sno_bastion_vcpu: 2
sno_bastion_memory: 4
sno_bastion_disk_size: 20
sno_bastion_os_image: "https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
sno_bastion_mac_mgmt: "52:54:00:a1:23:10"   # NIC on default_network (management, DHCP)
sno_bastion_mac_sno: "52:54:00:26:a1:02"    # NIC on sno_network (cluster access, static)

# SNO Master VM Configuration
sno_master_vcpu: 8
sno_master_memory: 20
sno_master_disk_size: 120
sno_cluster_os_image_name: "agent.x86_64.iso"

# [CHANGE] SNO Cluster network parameters — used in install-config.yaml.j2, agent-config.yaml.j2, and helper_node.sh.j2
# sno_master_mac must match the NIC MAC defined in master.tf.j2
# sno_interface is the NIC name inside RHCOS (verify with your hardware/VM config)
# sno_api_vip / sno_ingress_vip are added to the bastion's cluster NIC by helper_node.sh
sno_cluster_name: "ocp4"
sno_base_domain: "example.com"
sno_machine_network: "192.168.10.0/24"
sno_proxy_ip: "192.168.10.2"   # also used as DNS server for the cluster
sno_proxy_port: "3128"
sno_master_ip: "192.168.10.10"
sno_gateway: "192.168.10.1"
sno_master_mac: "52:54:00:26:a1:10"
sno_interface: "enp1s0"
sno_api_vip: "192.168.10.100"
sno_ingress_vip: "192.168.10.101"

# Paths used for ISO generation on localhost and cluster monitoring (set by 01-infra-bastion.yml)
sno_installer_path: "{{ sno_tf_dir }}/openshift-install"
# Where 01-infra-bastion.yml fetches the installer tarball from. Override to
# point at an internal mirror (or, in test/mock-run.sh, a local file:// copy).
sno_installer_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ sno_cluster_version }}/openshift-install-linux.tar.gz"
sno_manifests_dir: "{{ sno_tf_dir }}/generated/{{ sno_cluster_name }}"

# ==============================================================================
# Disconnected install — mirror registry on the bastion
# ==============================================================================
# false — connected install: the cluster pulls from quay.io through the
#         bastion's squid proxy. This is the original behaviour and the
#         default; nothing below is used.
# true  — disconnected install: a registry on the bastion serves the mirrored
#         release payload, the proxy block is dropped from install-config, and
#         the cluster never talks to anything but the bastion. The *host* still
#         needs internet — it is what runs oc-mirror. See README.md.
sno_disconnected: false

# Registry endpoint, as the cluster sees it. Port 8443 because the bastion's
# HAProxy already owns 443 (helper_node.sh.j2). The hostname must be one the
# master can resolve: helper_node.sh writes bastion0.<cluster>.<domain> into the
# bastion's /etc/hosts, and its dnsmasq serves that to the cluster.
sno_mirror_registry_host: "bastion0.{{ sno_cluster_name }}.{{ sno_base_domain }}"
sno_mirror_registry_port: 8443
sno_mirror_registry: "{{ sno_mirror_registry_host }}:{{ sno_mirror_registry_port }}"
sno_mirror_registry_user: "mirror"
# [CHANGE] sno_mirror_registry_password — store it with ansible-vault for
#          anything but a throwaway lab (same reasoning as the bastion password)
sno_mirror_registry_password: "mirror"
# Plain Docker Distribution. Red Hat's mirror-registry (Quay mini) is supported
# on RHEL only — this bastion is CentOS Stream — and wants ~8 GB RAM against the
# 4 GB here. Pulled from quay.io rather than docker.io to stay clear of Docker
# Hub's anonymous rate limit.
sno_mirror_registry_image: "quay.io/libpod/registry:2.8.2"
sno_mirror_registry_dir: "/opt/sno-mirror"      # on the bastion
sno_mirror_dir: "{{ sno_base_dir }}/mirror"     # on the host: CA, certs, oc-mirror workspace

# Mirroring the release payload needs far more than the 20 GB a connected
# bastion gets. Checked by an assert before anything is created, so the run
# fails in seconds rather than when the filesystem fills mid-mirror.
sno_mirror_min_bastion_disk: 100

sno_oc_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ sno_cluster_version }}/oc-mirror.tar.gz"

# What to mirror. Pin exact versions: "stable" moves, and a moving target makes
# oc-mirror re-resolve (and the cluster's mirrored payload drift from the
# installer binary) on every run.
# Mirror the Cincinnati graph image too. Only needed to drive in-cluster
# upgrades via OSUS; it costs an extra api.openshift.com fetch and build step.
sno_mirror_graph: false
sno_mirror_channel: "stable-4.20"
sno_mirror_min_version: "4.20.0"
sno_mirror_max_version: "4.20.0"
# Optional extras, e.g.
#   sno_mirror_operators:
#     - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
#       packages: [{name: local-storage-operator}]
sno_mirror_operators: []
sno_mirror_additional_images: []

# Where the mirrored payload ends up, as install-config's imageDigestSources.
# These two paths are oc-mirror v2's layout. oc-mirror also writes the
# authoritative version to
#   {{ sno_mirror_dir }}/working-dir/cluster-resources/idms-oc-mirror.yaml
# after a successful run — compare against it if image pulls fail on the node.
sno_mirror_image_sources:
  - source: quay.io/openshift-release-dev/ocp-release
    mirrors:
      - "{{ sno_mirror_registry }}/openshift/release-images"
  - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    mirrors:
      - "{{ sno_mirror_registry }}/openshift/release"

# Escape hatch: pin the exact release image `openshift-install` pulls when
# building the agent ISO. Leave empty to let the installer resolve it.
sno_release_image_override: ""

# openshift-mcp-server — used by 04-deploy-mcp-server.yml
# The pod runs on this host with hostNetwork, so sno_mcp_port is a host port and
# must be free. 8080 is a common collision; 8082 is the default here for that
# reason.
sno_mcp_port: 8082
sno_mcp_dir: "{{ sno_base_dir }}/mcp"
sno_mcp_source_kubeconfig: "{{ sno_manifests_dir }}/auth/kubeconfig"
sno_mcp_image: "quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/openshift-mcp-server:latest"
# ServiceAccount that supplies the bearer token for Thanos Querier and
# Alertmanager. It gets read-only monitoring roles and nothing else.
sno_mcp_sa_name: "mcp-metrics"
sno_mcp_namespace: "openshift-monitoring"
# "observability" no longer exists in the image — the server exits with
# "invalid toolset name: observability". Use "metrics" instead.
sno_mcp_toolsets:
  - core
  - config
  - openshift
  - metrics
# Skip TLS verification towards the monitoring routes. Leave false: a cluster
# built by this repo has the ingress CA in its kubeconfig CA bundle. Set true
# only if you hit "x509: certificate signed by unknown authority".
sno_mcp_insecure_tls: false
