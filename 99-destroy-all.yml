---
- name: SNO - destroy all
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    # Before terraform destroy: the pod holds a kubeconfig for a cluster that is
    # about to disappear, and podman keeps both pod and secret across reboots.
    - name: Remove the openshift-mcp-server pod
      containers.podman.podman_pod:
        name: openshift-mcp-server
        state: absent
      failed_when: false

    - name: Remove the openshift-mcp-server kubeconfig secret
      containers.podman.podman_secret:
        name: openshift-mcp-kubeconfig
        state: absent
      failed_when: false

    - name: Check if work directory exists
      ansible.builtin.stat:
        path: "{{ sno_tf_dir }}"
      register: tf_dir_stat

    - name: OpenTofu destroy (remove all VMs, networks, pool)
      ansible.builtin.command:
        cmd: tofu destroy -auto-approve
        chdir: "{{ sno_tf_dir }}"
      when: tf_dir_stat.stat.exists
      register: tf_destroy
      failed_when: false
      changed_when: tf_destroy.rc == 0 and 'Destroy complete!' in tf_destroy.stdout

    # Best-effort sweep for objects tofu destroy did not remove (state lost,
    # created out of band, or already partially torn down). Every one of these
    # is expected to fail when the object is simply not there, hence
    # failed_when: false — the following tasks do not depend on them.
    - name: Remove libvirt objects left behind by tofu destroy
      ansible.builtin.command:
        cmd: "virsh -c qemu:///system {{ item }}"
      loop:
        - "undefine --nvram {{ sno_prefix }}_master0"
        - "destroy {{ sno_prefix }}_bastion0"
        - "undefine --nvram {{ sno_prefix }}_bastion0"
        - "net-destroy {{ sno_prefix }}_network"
        - "net-undefine {{ sno_prefix }}_network"
        - "net-destroy default_network"
        - "net-undefine default_network"
        - "pool-destroy default"
        - "pool-undefine default"
      failed_when: false
      changed_when: false

    - name: Remove base directory (pool, work, ISO, scripts)
      ansible.builtin.file:
        path: "{{ sno_base_dir }}"
        state: absent
      become: true

    # Both halves of the /etc/hosts state: the marker block written by
    # 03-expose-console.yml and the single api/api-int line written by
    # 02-create-sno-cluster.yml. Without these the host keeps resolving a
    # cluster that no longer exists.
    - name: Remove SNO console entries from /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SNO console proxy ({{ sno_cluster_name }}.{{ sno_base_domain }})"
        state: absent
      become: true

    - name: Remove SNO API entry from /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ sno_api_vip }} api.{{ sno_cluster_name }}.{{ sno_base_domain }} api-int.{{ sno_cluster_name }}.{{ sno_base_domain }}"
        state: absent
      become: true

    # Marker must stay byte-identical to what 04-deploy-mcp-server.yml writes.
    # The cluster-side ServiceAccount and its bindings need no cleanup here —
    # terraform destroy takes the whole cluster with them.
    - name: Remove SNO MCP monitoring route entries from /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SNO MCP monitoring routes ({{ sno_cluster_name }}.{{ sno_base_domain }})"
        state: absent
      become: true

    # --- nginx backend-aware cleanup ---
    # If other clusters still have backends registered, rebuild the SNI config
    # instead of tearing nginx down entirely.
    - name: Remove this cluster's nginx backend definition
      ansible.builtin.file:
        path: "/etc/nginx/stream.d/backends.d/{{ sno_cluster_name }}.{{ sno_base_domain }}.json"
        state: absent
      become: true

    - name: Check if backends.d directory exists
      ansible.builtin.stat:
        path: /etc/nginx/stream.d/backends.d
      register: _backends_dir

    - name: Find remaining nginx backends
      ansible.builtin.find:
        paths: /etc/nginx/stream.d/backends.d
        patterns: '*.json'
      register: _remaining_backends
      become: true
      when: _backends_dir.stat.exists | default(false)

    - name: Read remaining backend definitions
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _remaining_backends.files }}"
      register: _remaining_slurps
      become: true
      when: (_remaining_backends.matched | default(0)) > 0

    - name: Rebuild nginx config with remaining backends
      ansible.builtin.template:
        src: templates/nginx-sno-stream.conf.j2
        dest: /etc/nginx/stream.d/sno.conf
        mode: '0644'
      become: true
      vars:
        sno_all_backends: >-
          {{ _remaining_slurps.results
             | map(attribute='content')
             | map('b64decode')
             | map('from_json')
             | list }}
      when: (_remaining_backends.matched | default(0)) > 0

    - name: Reload nginx after backend rebuild
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true
      failed_when: false
      when: (_remaining_backends.matched | default(0)) > 0

    - name: Remove nginx SNO stream config (no backends left)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/nginx/stream.d/sno.conf
        - /etc/nginx/stream.d/backends.d
      when: (_remaining_backends.matched | default(0)) == 0

    - name: Remove SNO stream block from nginx.conf
      ansible.builtin.blockinfile:
        path: /etc/nginx/nginx.conf
        marker: "# {mark} SNO stream proxy"
        block: ""
      become: true
      failed_when: false
      when: (_remaining_backends.matched | default(0)) == 0

    - name: Stop and disable nginx (no backends left)
      ansible.builtin.systemd_service:
        name: nginx
        enabled: false
        state: stopped
      become: true
      failed_when: false
      when: (_remaining_backends.matched | default(0)) == 0

    - name: Close firewalld ports (no backends left)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: disabled
        immediate: true
      become: true
      failed_when: false
      loop:
        - "80"
        - "443"
        - "6443"
      when: (_remaining_backends.matched | default(0)) == 0

    - name: Remove dnsmasq wildcard DNS config for this cluster
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - "/etc/dnsmasq.d/sno-{{ sno_cluster_name }}.{{ sno_base_domain }}.conf"
        - "/etc/dnsmasq.d/sno.conf"

    - name: Restart dnsmasq after removing SNO config
      ansible.builtin.systemd_service:
        name: dnsmasq
        state: restarted
      become: true
      failed_when: false

    - name: Close DNS service in firewalld
      ansible.posix.firewalld:
        service: dns
        permanent: true
        state: disabled
        immediate: true
      become: true
      failed_when: false
