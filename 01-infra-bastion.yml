---
- name: SNO - Host SELinux preparation (Fedora/RHEL/CentOS Stream)
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Ensure policycoreutils-python-utils is installed (provides semanage)
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      become: true
      when:
        - ansible_facts['selinux'].status == 'enabled'
        - ansible_facts['os_family'] == 'RedHat'

    - name: Ensure libvirt directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ sno_pool_dir }}"
        - "{{ sno_tf_dir }}"

    - name: Set SELinux virt_image_t context for libvirt directories
      ansible.builtin.command:
        cmd: semanage fcontext -a -t virt_image_t "{{ item }}(/.*)?"
      become: true
      loop:
        - "{{ sno_pool_dir }}"
        - "{{ sno_tf_dir }}"
      register: semanage_result
      changed_when: semanage_result.rc == 0
      failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr
      when: ansible_facts['selinux'].status == 'enabled'

    - name: Apply SELinux contexts to libvirt directories
      ansible.builtin.command:
        cmd: restorecon -Rv "{{ item }}"
      become: true
      loop:
        - "{{ sno_pool_dir }}"
        - "{{ sno_tf_dir }}"
      register: restorecon_result
      changed_when: restorecon_result.stdout != ''
      when: ansible_facts['selinux'].status == 'enabled'

- name: SNO - infrastructure + bastion
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    # First, so the disconnected preflight asserts fail before anything is
    # created, and so the registry certificate exists by the time the bastion
    # play needs to copy it over.
    - name: Prepare the mirror registry PKI and pull secret
      ansible.builtin.import_tasks: tasks/mirror-ca.yml
      when: sno_disconnected | bool

    - name: Remove legacy standalone .tf files superseded by infra.tf
      ansible.builtin.file:
        path: "{{ sno_tf_dir }}/{{ item }}"
        state: absent
      loop:
        - main.tf
        - pool.tf
        - default_network.tf
        - "{{ sno_prefix }}_network.tf"
        - "{{ sno_prefix }}_cluster_master0.tf"

    - name: Remove SNO master domain from OpenTofu state if present (managed by 02-create-sno-cluster.yml)
      ansible.builtin.command:
        cmd: tofu state rm libvirt_domain.{{ sno_prefix }}_master0
        chdir: "{{ sno_tf_dir }}"
      failed_when: false
      changed_when: false

    - name: Generate OpenTofu manifests
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "{{ sno_tf_dir }}/{{ item.dest }}"
        mode: '0644'
      loop:
        - {src: infra.tf.j2, dest: "infra.tf"}
        - {src: bastion.tf.j2, dest: "{{ sno_prefix }}_bastion0.tf"}

    - name: OpenTofu init
      ansible.builtin.command:
        cmd: tofu init -input=false
        chdir: "{{ sno_tf_dir }}"
      register: tf_init
      changed_when: "'has been successfully initialized' in tf_init.stdout"

    - name: OpenTofu apply (pool, networks, bastion VM)
      ansible.builtin.command:
        cmd: tofu apply -auto-approve -input=false
        chdir: "{{ sno_tf_dir }}"
      register: tf_apply
      changed_when: "'Apply complete!' in tf_apply.stdout"

    - name: Read bastion IP from the OpenTofu output
      ansible.builtin.command:
        cmd: tofu output -raw bastion_ip
        chdir: "{{ sno_tf_dir }}"
      register: tf_bastion_ip
      changed_when: false

    - name: Set bastion IP fact
      ansible.builtin.set_fact:
        sno_bastion_ip: "{{ tf_bastion_ip.stdout | trim }}"

    - name: Assert the bastion received a DHCP lease
      ansible.builtin.assert:
        that:
          - sno_bastion_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
        fail_msg: >-
          The bastion has no management IP. Check the libvirt DHCP lease with
          `virsh -c qemu:///system domifaddr {{ sno_prefix }}_bastion0`.

    - name: Wait for bastion SSH
      ansible.builtin.wait_for:
        host: "{{ sno_bastion_ip }}"
        port: 22
        timeout: 300

    - name: Generate login_bastion.sh
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          sshpass -p {{ sno_bastion_password }} ssh {{ sno_bastion_user }}@{{ sno_bastion_ip }} \
            -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$@"
        dest: "{{ sno_tf_dir }}/{{ sno_prefix }}_login_bastion0.sh"
        # Embeds the bastion password — keep it owner-only.
        mode: '0700'
      no_log: true

    - name: Add bastion to dynamic inventory
      ansible.builtin.add_host:
        name: bastion_server
        ansible_host: "{{ sno_bastion_ip }}"
        ansible_user: "{{ sno_bastion_user }}"
        ansible_password: "{{ sno_bastion_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      no_log: true

- name: SNO - configure bastion helper services
  hosts: bastion_server
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Check if helper node is already setup
      ansible.builtin.stat:
        path: /etc/helper_node_setup_info
      register: helper_setup_check

    - name: Copy pull secret and setup helper services
      when: not helper_setup_check.stat.exists
      block:
        - name: Copy pull secret to root
          ansible.builtin.copy:
            src: "{{ sno_pull_secret_path }}"
            dest: /root/openshift-pull-secret
            mode: '0600'
          become: true

        - name: Generate and copy helper_node.sh
          ansible.builtin.template:
            src: "{{ playbook_dir }}/templates/helper_node.sh.j2"
            dest: /root/helper_node.sh
            mode: '0755'
          become: true

        - name: Run helper_node.sh
          ansible.builtin.command: bash /root/helper_node.sh
          environment:
            PLATFORM: none
            CLUSTER_VERSION: "{{ sno_cluster_version }}"
          become: true
          changed_when: true

    # Outside the helper_node.sh guard above on purpose: the registry has to
    # come up on a re-run too, where the bastion is already configured.
    - name: Run the mirror registry on the bastion
      ansible.builtin.import_tasks: tasks/mirror-registry.yml
      when: sno_disconnected | bool

  handlers:
    # Notified by tasks/mirror-registry.yml when the certificate or the Quadlet
    # unit changes. It lives here rather than in the tasks file because only a
    # play can declare handlers.
    - name: Restart the mirror registry
      ansible.builtin.systemd_service:
        name: sno-mirror-registry.service
        state: restarted
      become: true

- name: SNO - generate agent ISO on localhost
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Verify pull secret exists
      ansible.builtin.stat:
        path: "{{ sno_pull_secret_path }}"
      register: pull_secret_stat

    - name: Assert the pull secret is present
      ansible.builtin.assert:
        that:
          - pull_secret_stat.stat.exists
        fail_msg: |
          Pull secret not found: {{ sno_pull_secret_path }}
          Download it from https://console.redhat.com/openshift/install/pull-secret
          and place it at {{ sno_pull_secret_path }}

    - name: Create manifests directory structure
      ansible.builtin.file:
        path: "{{ sno_manifests_dir }}/openshift"
        state: directory
        mode: '0755'
        recurse: true

    - name: Generate SSH keypair for cluster access if absent
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -N '' -f {{ sno_tf_dir }}/openshift_rsa"
        creates: "{{ sno_tf_dir }}/openshift_rsa"

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ sno_tf_dir }}/openshift_rsa.pub"
      register: _sno_ssh_pubkey_b64

    - name: Set SSH public key fact
      ansible.builtin.set_fact:
        _sno_ssh_pubkey: "{{ _sno_ssh_pubkey_b64.content | b64decode | trim }}"

    - name: Download openshift-install tarball
      ansible.builtin.get_url:
        url: "{{ sno_installer_url }}"
        dest: "{{ sno_tf_dir }}/openshift-install-linux.tar.gz"
        mode: '0644'

    - name: Extract openshift-install binary
      ansible.builtin.unarchive:
        src: "{{ sno_tf_dir }}/openshift-install-linux.tar.gz"
        dest: "{{ sno_tf_dir }}"
        include:
          - openshift-install
        creates: "{{ sno_installer_path }}"

    # Must precede install-config: the ISO is built from the mirrored payload,
    # and the template needs the CA and the merged pull secret this sets up.
    - name: Mirror the release payload into the bastion registry
      ansible.builtin.import_tasks: tasks/mirror-content.yml
      when: sno_disconnected | bool

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: templates/install-config.yaml.j2
        dest: "{{ sno_manifests_dir }}/install-config.yaml"
        mode: '0600'

    - name: Render agent-config.yaml
      ansible.builtin.template:
        src: templates/agent-config.yaml.j2
        dest: "{{ sno_manifests_dir }}/agent-config.yaml"
        mode: '0644'

    # The manifests below are optional, and openshift/ survives between runs
    # of 01. Remove them first so that flipping sno_disconnected back to false
    # does not leave a disconnected-only manifest behind for the next ISO. The
    # composefs MachineConfig is listed because 01 used to write it: it ran
    # `modprobe composefs`, but RHEL 9.6 and 10 kernels have no such module
    # (composefs is userspace over erofs + overlayfs), and nothing in the 4.22
    # or 5.0.1 installer or MCO refers to it — a 5.0.1 install without it was
    # verified live.
    - name: Remove optional manifests left by an earlier run
      ansible.builtin.file:
        path: "{{ sno_manifests_dir }}/openshift/{{ item }}"
        state: absent
      loop:
        - 99-master-composefs-module.yaml
        - 99-samples-removed.yaml
        - 99-operatorhub-disable-default-sources.yaml

    # Disconnected only: start the Cluster Samples Operator as Removed. Without
    # a Config it bootstraps by dialling registry.redhat.io for 5 minutes, and
    # on an isolated network it runs that loop twice before falling back to
    # Removed. Those ~10 minutes only start once openshift-apiserver is up, so
    # on a live 5.0.1 run they pushed openshift-samples (and with it
    # `wait-for install-complete`) ~2 minutes past the 40-minute limit on an
    # otherwise healthy cluster. With a Config present at startup the operator
    # skips the check entirely (cluster-samples-operator pkg/stub/handler.go,
    # same in release-4.22 and release-5.0). The samples could not import
    # anything without registry.redhat.io anyway.
    - name: Start the Cluster Samples Operator as Removed (disconnected)
      ansible.builtin.copy:
        dest: "{{ sno_manifests_dir }}/openshift/99-samples-removed.yaml"
        mode: '0644'
        content: |
          apiVersion: samples.operator.openshift.io/v1
          kind: Config
          metadata:
            name: cluster
          spec:
            managementState: Removed
      when: sno_disconnected | bool

    # Disconnected only: disable the default OperatorHub catalogs at install
    # time. They point at registry.redhat.io, so on an isolated network their
    # catalog pods sit in ImagePullBackOff forever. Red Hat's restricted-network
    # docs make this a mandatory post-install `oc patch`; the CVO ships
    # OperatorHub/cluster as `release.openshift.io/create-only`, so an object
    # created from this manifest at bootstrap is left as written. Mirrored
    # operators come back through the CatalogSource oc-mirror generates (see
    # README).
    - name: Disable the default OperatorHub catalogs (disconnected)
      ansible.builtin.copy:
        dest: "{{ sno_manifests_dir }}/openshift/99-operatorhub-disable-default-sources.yaml"
        mode: '0644'
        content: |
          apiVersion: config.openshift.io/v1
          kind: OperatorHub
          metadata:
            name: cluster
          spec:
            disableAllDefaultSources: true
      when: sno_disconnected | bool

    # Built as a dict rather than inline so the release override can be absent
    # entirely: openshift-install treats an empty
    # OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE as a value, not as unset.
    - name: Build the agent ISO environment
      ansible.builtin.set_fact:
        _sno_iso_env: >-
          {{ {'XDG_RUNTIME_DIR': sno_manifests_dir}
             | combine({'OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE': sno_release_image_override}
                       if sno_release_image_override | length > 0 else {}) }}

    - name: Generate agent ISO
      ansible.builtin.command:
        cmd: "{{ sno_installer_path }} agent create image --dir {{ sno_manifests_dir }}"
      environment: "{{ _sno_iso_env }}"
      changed_when: true

    - name: Copy agent ISO to work directory
      ansible.builtin.copy:
        src: "{{ sno_manifests_dir }}/agent.x86_64.iso"
        dest: "{{ sno_tf_dir }}/{{ sno_cluster_os_image_name }}"
        remote_src: true
        mode: '0644'
