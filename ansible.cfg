[defaults]
# Playbooks target localhost and a bastion added at runtime via add_host,
# so there is no static inventory to point at.
localhost_warning = False
interpreter_python = auto_silent
# ansible-core native YAML output; the community.general.yaml callback is
# deprecated and breaks on recent Python.
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
force_handlers = True
retry_files_enabled = False

[ssh_connection]
pipelining = True
