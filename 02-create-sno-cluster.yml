---
- name: SNO - cluster VM (1 master)
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Verify agent ISO exists
      ansible.builtin.stat:
        path: "{{ sno_tf_dir }}/{{ sno_cluster_os_image_name }}"
      register: iso_stat

    - name: Verify openshift-install binary exists
      ansible.builtin.stat:
        path: "{{ sno_installer_path }}"
      register: installer_stat

    - name: Assert 01-infra-bastion.yml has already run
      ansible.builtin.assert:
        that:
          - iso_stat.stat.exists
          - installer_stat.stat.exists
        fail_msg: >-
          Missing prerequisites from 01-infra-bastion.yml —
          agent ISO ({{ sno_tf_dir }}/{{ sno_cluster_os_image_name }}):
          {{ 'ok' if iso_stat.stat.exists else 'MISSING' }},
          openshift-install ({{ sno_installer_path }}):
          {{ 'ok' if installer_stat.stat.exists else 'MISSING' }}

    - name: Generate master OpenTofu manifest
      ansible.builtin.template:
        src: templates/master.tf.j2
        dest: "{{ sno_tf_dir }}/{{ sno_prefix }}_cluster_master0.tf"
        mode: '0644'

    - name: Remove SNO master domain from OpenTofu state if present (stale from prior run)
      ansible.builtin.command:
        cmd: tofu state rm libvirt_domain.{{ sno_prefix }}_master0
        chdir: "{{ sno_tf_dir }}"
      failed_when: false
      changed_when: false

    - name: Undefine SNO master domain from libvirt if it already exists
      ansible.builtin.command:
        cmd: virsh -c qemu:///system undefine --nvram {{ sno_prefix }}_master0
      failed_when: false
      changed_when: false

    - name: OpenTofu apply (create SNO master VM)
      ansible.builtin.command:
        cmd: tofu apply -auto-approve -input=false
        chdir: "{{ sno_tf_dir }}"
      register: tf_apply
      changed_when: "'Apply complete!' in tf_apply.stdout"

    - name: Add SNO API endpoint to /etc/hosts for monitoring
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ sno_api_vip }} api.{{ sno_cluster_name }}.{{ sno_base_domain }} api-int.{{ sno_cluster_name }}.{{ sno_base_domain }}"
        state: present
      become: true

    - name: Wait for bootstrap complete
      ansible.builtin.command:
        cmd: "{{ sno_installer_path }} agent wait-for bootstrap-complete --dir {{ sno_manifests_dir }} --log-level info"
      async: 3600
      poll: 30
      changed_when: true

    - name: Wait for install complete
      ansible.builtin.command:
        cmd: "{{ sno_installer_path }} agent wait-for install-complete --dir {{ sno_manifests_dir }} --log-level info"
      async: 7200
      poll: 30
      changed_when: true

    - name: Read bastion IP from the OpenTofu output
      ansible.builtin.command:
        cmd: tofu output -raw bastion_ip
        chdir: "{{ sno_tf_dir }}"
      register: tf_bastion_ip
      changed_when: false

    - name: Set bastion IP fact
      ansible.builtin.set_fact:
        sno_bastion_ip: "{{ tf_bastion_ip.stdout | trim }}"

    - name: Assert the bastion has a management IP
      ansible.builtin.assert:
        that:
          - sno_bastion_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
        fail_msg: >-
          The bastion has no management IP. Check the libvirt DHCP lease with
          `virsh -c qemu:///system domifaddr {{ sno_prefix }}_bastion0`.

    - name: Add bastion to inventory for kubeconfig copy
      ansible.builtin.add_host:
        name: bastion_server
        ansible_host: "{{ sno_bastion_ip }}"
        ansible_user: "{{ sno_bastion_user }}"
        ansible_password: "{{ sno_bastion_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      no_log: true

- name: SNO - copy kubeconfig to bastion
  hosts: bastion_server
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Create .kube directory for bastion user
      ansible.builtin.file:
        path: "/home/{{ sno_bastion_user }}/.kube"
        state: directory
        mode: '0700'
        owner: "{{ sno_bastion_user }}"
        group: "{{ sno_bastion_user }}"
      become: true

    - name: Copy kubeconfig to bastion
      ansible.builtin.copy:
        src: "{{ sno_manifests_dir }}/auth/kubeconfig"
        dest: "/home/{{ sno_bastion_user }}/.kube/config"
        mode: '0600'
        owner: "{{ sno_bastion_user }}"
        group: "{{ sno_bastion_user }}"
      become: true
