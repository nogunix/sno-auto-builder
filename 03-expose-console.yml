---
- name: SNO - Expose console to home network via nginx stream proxy
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    # dnf, semanage, seboolean, firewalld and the /etc/nginx/stream.d layout below
    # are all RedHat-family specific. Fail with a clear message rather than a
    # confusing "dnf not found" partway through.
    - name: Assert the host is a RedHat-family distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
        fail_msg: >-
          03-expose-console.yml supports Fedora / RHEL / CentOS Stream only
          (detected {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}). On other distributions,
          proxy ports 80/443/6443 to {{ sno_ingress_vip }} / {{ sno_api_vip }}
          by hand.

    - name: Install nginx and stream module
      ansible.builtin.dnf:
        name:
          - nginx
          - nginx-mod-stream
        state: present
      become: true

    - name: Deploy nginx.conf (stream-only, no conflicting http server)
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: '0644'
        backup: true
      become: true
      notify: Reload nginx

    - name: Allow nginx to connect to upstream (SELinux)
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      become: true
      when: ansible_facts['selinux'].status == 'enabled'

    - name: Allow port 6443 for SELinux (nginx stream)
      ansible.builtin.command:
        cmd: semanage port -a -t http_port_t -p tcp 6443
      become: true
      register: semanage_result
      changed_when: semanage_result.rc == 0
      failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr
      when: ansible_facts['selinux'].status == 'enabled'

    - name: Create nginx stream.d directory
      ansible.builtin.file:
        path: /etc/nginx/stream.d
        state: directory
        mode: '0755'
      become: true

    - name: Deploy SNO stream proxy config
      ansible.builtin.template:
        src: templates/nginx-sno-stream.conf.j2
        dest: /etc/nginx/stream.d/sno.conf
        mode: '0644'
      become: true
      notify: Reload nginx

    - name: Open ports in firewalld (80, 443, 6443)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      become: true
      loop:
        - "80"
        - "443"
        - "6443"

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started
      become: true

    - name: Write /etc/hosts entries to file
      ansible.builtin.copy:
        dest: "{{ sno_base_dir }}/hosts-entries.txt"
        content: |
          {{ ansible_facts['default_ipv4']['address'] }}  console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ ansible_facts['default_ipv4']['address'] }}  oauth-openshift.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ ansible_facts['default_ipv4']['address'] }}  api.{{ sno_cluster_name }}.{{ sno_base_domain }}
        mode: '0644'

    - name: Show instructions for home devices
      ansible.builtin.debug:
        msg: >-
          /etc/hosts entries saved to {{ sno_base_dir }}/hosts-entries.txt —
          run: cat {{ sno_base_dir }}/hosts-entries.txt
          then add the lines to /etc/hosts on each home device.

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true
