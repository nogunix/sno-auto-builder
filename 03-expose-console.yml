---
- name: SNO - Expose console to home network via nginx stream proxy
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    # The LAN-facing address of this host — where nginx accepts 80/443/6443.
    sno_host_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

  tasks:
    # dnf, semanage, seboolean, firewalld and the /etc/nginx/stream.d layout below
    # are all RedHat-family specific. Fail with a clear message rather than a
    # confusing "dnf not found" partway through.
    - name: Assert the host is a RedHat-family distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
        fail_msg: >-
          03-expose-console.yml supports Fedora / RHEL / CentOS Stream only
          (detected {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}). On other distributions,
          proxy ports 80/443/6443 to {{ sno_ingress_vip }} / {{ sno_api_vip }}
          by hand.

    - name: Install nginx and stream module
      ansible.builtin.dnf:
        name:
          - nginx
          - nginx-mod-stream
        state: present
      become: true

    - name: Deploy nginx.conf (stream-only, no conflicting http server)
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: '0644'
        backup: true
      become: true
      notify: Reload nginx

    - name: Allow nginx to connect to upstream (SELinux)
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      become: true
      when: ansible_facts['selinux'].status == 'enabled'

    - name: Allow port 6443 for SELinux (nginx stream)
      ansible.builtin.command:
        cmd: semanage port -a -t http_port_t -p tcp 6443
      become: true
      register: semanage_result
      changed_when: semanage_result.rc == 0
      failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr
      when: ansible_facts['selinux'].status == 'enabled'

    - name: Create nginx stream.d directory
      ansible.builtin.file:
        path: /etc/nginx/stream.d
        state: directory
        mode: '0755'
      become: true

    - name: Deploy SNO stream proxy config
      ansible.builtin.template:
        src: templates/nginx-sno-stream.conf.j2
        dest: /etc/nginx/stream.d/sno.conf
        mode: '0644'
      become: true
      notify: Reload nginx

    - name: Open ports in firewalld (80, 443, 6443)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      become: true
      loop:
        - "80"
        - "443"
        - "6443"

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started
      become: true

    # Managed as a marker block so 99-destroy-all.yml can remove it cleanly.
    # Only the apps.* names go here: 02-create-sno-cluster.yml already points
    # api/api-int straight at sno_api_vip, which the host reaches directly over
    # the libvirt NAT network. Adding a second api entry here would shadow it.
    - name: Manage /etc/hosts entries for the console on this host
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SNO console proxy ({{ sno_cluster_name }}.{{ sno_base_domain }})"
        block: |
          {{ sno_host_ip }} console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ sno_host_ip }} oauth-openshift.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ sno_host_ip }} downloads-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
        state: present
      become: true

    # Other devices on the LAN cannot reach sno_api_vip, so their api entry has
    # to go through the nginx stream proxy on this host as well.
    - name: Write /etc/hosts entries for other devices on the LAN
      ansible.builtin.copy:
        dest: "{{ sno_base_dir }}/hosts-entries.txt"
        content: |
          {{ sno_host_ip }} console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ sno_host_ip }} oauth-openshift.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ sno_host_ip }} downloads-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          {{ sno_host_ip }} api.{{ sno_cluster_name }}.{{ sno_base_domain }}
        mode: '0644'

    # --- Wildcard DNS via dnsmasq ---
    # /etc/hosts only covers a fixed set of names; any new Route would fail to
    # resolve on the LAN. dnsmasq provides *.apps wildcard so every Route works
    # and LAN clients only need a one-line resolver config.
    - name: Install dnsmasq
      ansible.builtin.dnf:
        name: dnsmasq
        state: present
      become: true

    - name: Ensure /etc/dnsmasq.d/ is included in dnsmasq.conf
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        line: "conf-dir=/etc/dnsmasq.d/,*.conf"
        regexp: '^conf-dir=/etc/dnsmasq\.d'
        state: present
      become: true

    - name: Deploy SNO wildcard DNS config
      ansible.builtin.template:
        src: templates/dnsmasq-sno.conf.j2
        dest: /etc/dnsmasq.d/sno.conf
        mode: '0644'
      become: true
      notify: Restart dnsmasq

    - name: Open DNS service in firewalld
      ansible.posix.firewalld:
        service: dns
        permanent: true
        state: enabled
        immediate: true
      become: true

    - name: Enable and start dnsmasq
      ansible.builtin.systemd_service:
        name: dnsmasq
        enabled: true
        state: started
      become: true

    - name: Show what was configured
      ansible.builtin.debug:
        msg: >-
          nginx stream proxy + dnsmasq wildcard DNS configured on {{ sno_host_ip }}.
          Console: https://console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}.
          For LAN clients, configure a resolver
          (Mac: sudo bash -c 'mkdir -p /etc/resolver &&
          echo "nameserver {{ sno_host_ip }}" > /etc/resolver/{{ sno_base_domain }}').
          Fallback: copy {{ sno_base_dir }}/hosts-entries.txt into their /etc/hosts.
          Removed by 99-destroy-all.yml.

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true

    - name: Restart dnsmasq
      ansible.builtin.systemd_service:
        name: dnsmasq
        state: restarted
      become: true
