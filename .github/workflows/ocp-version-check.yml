name: OCP Version Check

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # "stable" follows the newest GA (5.x since 5.0.1); stable-5.0 and
      # stable-4.22 are the pins vars.yml suggests. 5.x clients are published
      # under openshift-v4/ too, so one base URL covers both majors.
      #
      # oc-mirror is checked separately and at the version vars.yml actually
      # uses (sno_oc_mirror_version): 5.0 ships no oc-mirror.tar.gz, so it is
      # deliberately not tied to the installer channel.
      - name: Check versions and download URLs
        id: urls
        run: |
          BASE="https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp"
          OC_MIRROR_VERSION=$(grep -oP '^sno_oc_mirror_version:\s*"\K[^"]+' vars.yml)
          : > /tmp/versions.txt
          : > /tmp/failed_urls.txt
          for CHANNEL in stable stable-5.0 stable-4.22; do
            VERSION=$(curl -sSf "${BASE}/${CHANNEL}/release.txt" \
              | grep -oP 'Version:\s*\K[\d.]+' || echo "unknown")
            echo "${CHANNEL}: ${VERSION}" | tee -a /tmp/versions.txt
            for FILE in openshift-client-linux.tar.gz openshift-install-linux.tar.gz; do
              URL="${BASE}/${CHANNEL}/${FILE}"
              STATUS=$(curl -sSo /dev/null -w "%{http_code}" --head "${URL}")
              echo "${STATUS} ${URL}"
              [[ "${STATUS}" == "200" ]] || echo "${URL} (HTTP ${STATUS})" >> /tmp/failed_urls.txt
            done
          done
          URL="${BASE}/${OC_MIRROR_VERSION}/oc-mirror.tar.gz"
          STATUS=$(curl -sSo /dev/null -w "%{http_code}" --head "${URL}")
          echo "${STATUS} ${URL}"
          [[ "${STATUS}" == "200" ]] || echo "${URL} (HTTP ${STATUS})" >> /tmp/failed_urls.txt
          if [[ -s /tmp/failed_urls.txt ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ansible-lint
        id: lint
        uses: ansible/ansible-lint@v25
        continue-on-error: true

      - name: Open issue on failure
        if: steps.urls.outputs.failed == 'true' || steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const versions = fs.readFileSync('/tmp/versions.txt', 'utf8').trim();
            const urlFailed = '${{ steps.urls.outputs.failed }}' === 'true';
            const lintFailed = '${{ steps.lint.outcome }}' === 'failure';
            const stable = (versions.match(/^stable: (.*)$/m) || [])[1] || 'unknown';

            const lines = [
              `## OCP Version Check Failed`,
              ``,
              `**Detected versions:**`,
              '```',
              versions,
              '```',
              `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              ``,
            ];

            if (urlFailed) {
              const urls = fs.readFileSync('/tmp/failed_urls.txt', 'utf8').trim();
              lines.push(`### Download URLs unreachable`);
              lines.push('```');
              lines.push(urls);
              lines.push('```');
              lines.push('');
            }

            if (lintFailed) {
              lines.push(`### ansible-lint failed`);
              lines.push(`Check the workflow run for details.`);
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['ocp-version-check'],
              state: 'open',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: lines.join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `OCP version check failed (stable: ${stable})`,
                body: lines.join('\n'),
                labels: ['ocp-version-check'],
              });
            }
