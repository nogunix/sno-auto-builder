---
- name: Render templates for CI validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    sno_base_dir: /tmp/sno-rendered
    sno_pool_dir: /tmp/sno-rendered/pool
    sno_tf_dir: /tmp/sno-rendered
    sno_installer_path: /tmp/sno-rendered/openshift-install
    sno_manifests_dir: /tmp/sno-rendered/generated/ocp4
    _sno_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyForCITesting ci@github-actions"
    sno_mirror_dir: /tmp/sno-rendered/mirror
    # Only has to look like a PEM: this exercises the indentation of the
    # additionalTrustBundle block, not certificate parsing.
    _ci_fake_ca: |-
      -----BEGIN CERTIFICATE-----
      MIIBfakeCertificateForCITestingOnlyNotARealKeyAtAll
      -----END CERTIFICATE-----
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/sno-rendered
        state: directory
        mode: "0755"

    - name: Render infra.tf
      ansible.builtin.template:
        src: templates/infra.tf.j2
        dest: /tmp/sno-rendered/infra.tf
        mode: "0644"

    - name: Render bastion.tf
      ansible.builtin.template:
        src: templates/bastion.tf.j2
        dest: /tmp/sno-rendered/{{ sno_prefix }}_bastion0.tf
        mode: "0644"

    - name: Render master.tf
      ansible.builtin.template:
        src: templates/master.tf.j2
        dest: /tmp/sno-rendered/{{ sno_prefix }}_master0.tf
        mode: "0644"

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: templates/install-config.yaml.j2
        dest: /tmp/sno-rendered/install-config.yaml
        mode: "0644"

    - name: Render agent-config.yaml
      ansible.builtin.template:
        src: templates/agent-config.yaml.j2
        dest: /tmp/sno-rendered/agent-config.yaml
        mode: "0644"

    - name: Render nginx-sno-stream.conf
      ansible.builtin.template:
        src: templates/nginx-sno-stream.conf.j2
        dest: /tmp/sno-rendered/nginx-sno-stream.conf
        mode: "0644"
      vars:
        sno_all_backends:
          - apps_domain: "apps.{{ sno_cluster_name }}.{{ sno_base_domain }}"
            api_domain: "api.{{ sno_cluster_name }}.{{ sno_base_domain }}"
            ingress_vip: "{{ sno_ingress_vip }}"
            api_vip: "{{ sno_api_vip }}"

    - name: Render dnsmasq-sno.conf
      ansible.builtin.template:
        src: templates/dnsmasq-sno.conf.j2
        dest: /tmp/sno-rendered/dnsmasq-sno.conf
        mode: "0644"
      vars:
        sno_host_ip: "192.168.20.1"

    - name: Render helper_node.sh
      ansible.builtin.template:
        src: templates/helper_node.sh.j2
        dest: /tmp/sno-rendered/helper_node.sh
        mode: "0755"

    - name: Render nginx.conf
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /tmp/sno-rendered/nginx.conf
        mode: "0644"

    - name: Render openshift-mcp-server-pod.yaml
      ansible.builtin.template:
        src: templates/openshift-mcp-server-pod.yaml.j2
        dest: /tmp/sno-rendered/openshift-mcp-server-pod.yaml
        mode: "0644"

    # --- disconnected variants ---
    # `tofu validate` only covers the .tf output, so the YAML templates are
    # parsed back here instead. install-config.yaml.j2 is the one that matters:
    # its disconnected branch embeds a PEM block, and a one-space indentation
    # slip there produces a file that renders fine and fails at install time.
    - name: Render install-config.yaml (disconnected)
      ansible.builtin.template:
        src: templates/install-config.yaml.j2
        dest: /tmp/sno-rendered/install-config-disconnected.yaml
        mode: "0644"
      vars:
        sno_disconnected: true
        _sno_mirror_ca_cert: "{{ _ci_fake_ca }}"

    - name: Render the ImageSetConfiguration
      ansible.builtin.template:
        src: templates/imageset-config.yaml.j2
        dest: /tmp/sno-rendered/imageset-config.yaml
        mode: "0644"
      vars:
        sno_mirror_operators:
          - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
            packages:
              - name: local-storage-operator
        sno_mirror_additional_images:
          - name: registry.redhat.io/ubi9/ubi:latest

    - name: Render the mirror registry Quadlet unit
      ansible.builtin.template:
        src: templates/mirror-registry.container.j2
        dest: /tmp/sno-rendered/sno-mirror-registry.container
        mode: "0644"

    - name: Read back the rendered YAML
      ansible.builtin.slurp:
        src: "/tmp/sno-rendered/{{ item }}"
      register: _rendered_yaml
      loop:
        - install-config.yaml
        - install-config-disconnected.yaml
        - imageset-config.yaml
        - agent-config.yaml

    - name: Assert the connected install-config still proxies and does not mirror
      ansible.builtin.assert:
        that:
          - "'proxy' in _ic"
          - "'imageDigestSources' not in _ic"
          - "'additionalTrustBundle' not in _ic"
        fail_msg: "The connected install-config changed shape: {{ _ic.keys() | list }}"
      vars:
        _ic: "{{ _rendered_yaml.results[0].content | b64decode | from_yaml }}"

    - name: Assert the disconnected install-config drops the proxy and wires the mirror
      ansible.builtin.assert:
        that:
          - "'proxy' not in _ic"
          # Proxyonly (the default) would silently drop the CA now that there
          # is no proxy, and every image pull would fail x509.
          - _ic.additionalTrustBundlePolicy == 'Always'
          - "'BEGIN CERTIFICATE' in _ic.additionalTrustBundle"
          - _ic.imageDigestSources | length == 2
          - _ic.imageDigestSources[0].mirrors[0] is search(':8443/openshift/release-images$')
        fail_msg: "The disconnected install-config is wrong: {{ _ic }}"
      vars:
        _ic: "{{ _rendered_yaml.results[1].content | b64decode | from_yaml }}"

    - name: Assert the ImageSetConfiguration is the v2 schema and pinned
      ansible.builtin.assert:
        that:
          - _isc.apiVersion == 'mirror.openshift.io/v2alpha1'
          - _isc.mirror.platform.channels[0].minVersion | length > 0
          - _isc.mirror.operators | length == 1
          - _isc.mirror.additionalImages | length == 1
        fail_msg: "The ImageSetConfiguration is wrong: {{ _isc }}"
      vars:
        _isc: "{{ _rendered_yaml.results[2].content | b64decode | from_yaml }}"

    # Rendered under a non-.tf name: next to infra.tf it would redeclare every
    # resource and break `tofu validate`. The point is the network mode — under
    # "nat" a disconnected node can still reach quay.io, so a gap in the mirror
    # passes silently instead of failing the install.
    - name: Render infra.tf (disconnected)
      ansible.builtin.template:
        src: templates/infra.tf.j2
        dest: /tmp/sno-rendered/infra-disconnected.tf.txt
        mode: "0644"
      vars:
        sno_disconnected: true

    - name: Read back both infra renders
      ansible.builtin.slurp:
        src: "/tmp/sno-rendered/{{ item }}"
      register: _rendered_infra
      loop:
        - infra.tf
        - infra-disconnected.tf.txt

    - name: Assert only the disconnected cluster network is isolated
      ansible.builtin.assert:
        that:
          - _connected is search('"' ~ sno_prefix ~ '_network"[^}]*mode\s+=\s+"nat"')
          - _disconnected is search('"' ~ sno_prefix ~ '_network"[^}]*mode\s+=\s+"none"')
          # The management network must keep NAT: it is the bastion's egress.
          - _disconnected is search('"default_network"[^}]*mode\s+=\s+"nat"')
        fail_msg: "The cluster network mode does not follow sno_disconnected"
      vars:
        _connected: "{{ _rendered_infra.results[0].content | b64decode }}"
        _disconnected: "{{ _rendered_infra.results[1].content | b64decode }}"

    # The node has no other reachable clock: squid does not relay UDP/123 and a
    # disconnected run has no egress at all, so dropping this block sends the
    # agent's ntp_synchronizer validation looking for a server it cannot find.
    - name: Assert the agent config points the node at the bastion clock
      ansible.builtin.assert:
        that:
          - _ac.additionalNTPSources | default([]) | length > 0
          - sno_proxy_ip in _ac.additionalNTPSources
          - _ac.rendezvousIP == sno_master_ip
        fail_msg: "The agent config lost its NTP sources: {{ _ac }}"
      vars:
        _ac: "{{ _rendered_yaml.results[3].content | b64decode | from_yaml }}"
