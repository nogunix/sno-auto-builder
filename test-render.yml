---
- name: Render templates for CI validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    sno_base_dir: /tmp/sno-rendered
    sno_pool_dir: /tmp/sno-rendered/pool
    sno_tf_dir: /tmp/sno-rendered
    sno_installer_path: /tmp/sno-rendered/openshift-install
    sno_manifests_dir: /tmp/sno-rendered/generated/ocp4
    _sno_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyForCITesting ci@github-actions"
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/sno-rendered
        state: directory
        mode: "0755"

    - name: Render infra.tf
      ansible.builtin.template:
        src: templates/infra.tf.j2
        dest: /tmp/sno-rendered/infra.tf
        mode: "0644"

    - name: Render bastion.tf
      ansible.builtin.template:
        src: templates/bastion.tf.j2
        dest: /tmp/sno-rendered/{{ sno_prefix }}_bastion0.tf
        mode: "0644"

    - name: Render master.tf
      ansible.builtin.template:
        src: templates/master.tf.j2
        dest: /tmp/sno-rendered/{{ sno_prefix }}_master0.tf
        mode: "0644"

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: templates/install-config.yaml.j2
        dest: /tmp/sno-rendered/install-config.yaml
        mode: "0644"

    - name: Render agent-config.yaml
      ansible.builtin.template:
        src: templates/agent-config.yaml.j2
        dest: /tmp/sno-rendered/agent-config.yaml
        mode: "0644"

    - name: Render nginx-sno-stream.conf
      ansible.builtin.template:
        src: templates/nginx-sno-stream.conf.j2
        dest: /tmp/sno-rendered/nginx-sno-stream.conf
        mode: "0644"
      vars:
        sno_all_backends:
          - apps_domain: "apps.{{ sno_cluster_name }}.{{ sno_base_domain }}"
            api_domain: "api.{{ sno_cluster_name }}.{{ sno_base_domain }}"
            ingress_vip: "{{ sno_ingress_vip }}"
            api_vip: "{{ sno_api_vip }}"

    - name: Render dnsmasq-sno.conf
      ansible.builtin.template:
        src: templates/dnsmasq-sno.conf.j2
        dest: /tmp/sno-rendered/dnsmasq-sno.conf
        mode: "0644"
      vars:
        sno_host_ip: "192.168.20.1"
